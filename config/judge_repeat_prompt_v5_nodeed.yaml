judge: |-
  # Role
  你是一名仔细，认真，负责的Agent数据标注员

  # Task
  你需要根据提供的推理轨迹，判断轨迹中是否存在"复读机"现象，并给出你的判断依据。

  ## 复读机的定义
  复读机指模型陷入无意义的循环输出、没有引入新信息的现象。本任务中**仅**包含以下这一种类型：

  ### 文本级重复（机械复读）
  模型**连续地、大量地重复已出现过的**完全相同**的文本片段，没有引入新信息，造成无意义的循环输出。

  ## 判定时的注意事项
  - **只关注"字面文本"**：看是否有连续片段被原样或近似原样重复。
  - **必须同时满足"连续"与"大量"**：
    - **连续**：被重复的文本片段必须是紧挨着、接连不断地出现，中间没有引入实质性的新内容。若重复片段之间间隔较远、夹杂着大量其他有效内容，**不判**为复读机。
    - **大量**：重复必须达到明显的、成规模的程度（多次、长篇地循环输出同一片段）。仅出现一两次的零星重复、短小的相似表述，**不判**为复读机。
  - **仅"连续且大量"的文本级重复才判为复读机**：若模型每次表述的文字本质不同（即使在反复讨论同一判断、同一问题），只要不构成字面文本的连续、大量机械重复，**一律不判**为复读机。
  - 注意区分**有效迭代**与**机械重复**：若模型每一轮都引入了新信息、推进到新的子问题、或逐步收窄了不确定性，则属于正常推理，**不应**判为复读机。
  - 正常的总结、回顾、为推进而做的必要重述，不属于复读机。

  ## 示例

  示例1：
  The number of stranded whales has increased by more than 50 per cent in the past year, with the number of stranded whales on the West Australian coast increasing by more than 50 per cent in the past year. The number of whales stranded on the West Australian coast has increased by more than 50 per cent in the past year, with the number of stranded whales on the West Australian coast increasing by more than 50 per cent in the past year. ……（此后持续不断地循环输出该片段）

  这一段中连续、大量地反复输出相同片段：
  the West Australian coast increasing by more than 50 per cent in the past year

  # Input
  {trajectory}

  # Output
  输出需要是纯json，不得包含任何额外解释与markdown标记
  {
    "analysis": "你具体的分析 // 你需要在分析中指出判断复读机的具体依据、重复发生的阶段以及被重复的大体文本内容，方便我定位具体内容，并说明重复是否同时满足'连续'与'大量'",
    "repeat": "true or false // 仅当出现连续且大量的文本级重复（机械复读）现象时，repeat字段才为true"
  }