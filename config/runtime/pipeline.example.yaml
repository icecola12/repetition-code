dataset:
  uuid_field: uuid
  problem_field: problem
  expected_answer_field: expected_answer

prompts:
  rollout: config/prompts/rollout_prompt.yaml
  repetition: config/prompts/judge_repeat_prompt_v4.yaml
  correctness: config/prompts/judge_prompt.yaml

inference:
  max_tokens: 64000
  temperature: 0.7
  top_p: 0.95

rollout:
  rollout_count: 8
  max_workers: 128

judge:
  repeat_threshold: 1
  max_workers: 64

rerollout:
  prompt: config/prompts/turn2_rerollout_v4.yaml
  max_rerollout_attempts: 3
  parallel_tail_threshold: 0
  max_workers: 32

turn3_reform:
  prompt: config/prompts/turn3_reform_v3.yaml
  parse_max_retries: 3
  max_reform_attempts: 1
  parallel_tail_threshold: 0
  max_workers: 64

retry:
  rollout: {max_retries: 3, backoff_base: 2.0, backoff_max: 30.0}
  judge: {max_retries: 5, backoff_base: 2.0, backoff_max: 30.0}
  rerollout: {max_retries: 3, backoff_base: 2.0, backoff_max: 30.0}
