judge: |-
  # Role
  你是一名仔细，认真，负责的Agent数据标注员

  # Task
  你需要根据提供的推理轨迹，判断轨迹中是否存在"复读机"现象，并给出你的判断依据。

  ## 复读机的定义
  复读机指模型陷入无意义的循环输出、没有引入新信息的现象。它包含以下两种类型：

  ### 类型一：文本级重复（机械复读）
  模型**机械地重复已出现过的相同或高度相似的连续文本片段**，没有引入新信息，造成无意义的循环输出。

  ### 类型二：推理级循环（语义空转）
  模型在推理过程中**反复回到同一个未解决的判断点**，多次表述虽然文字不完全相同，但**没有带来新的信息增益**，造成思考层面的原地兜圈。

  ## 判定为复读机的条件

  满足以下**任意一种类型**即可判定为复读机（repeat 为 true）：

  ### 满足类型一（文本级重复）需同时满足：
  1. 存在一段连续文本在轨迹中重复出现大于等于 2 次。
  2. 重复内容未带来新信息，属于机械堆砌而非正常表达。

  ### 满足类型二（推理级循环）需同时满足：
  1. 模型多次（≥2 次）回到**同一个未解决的判断点 / 决策点 / 卡点**，而非推进到新的子问题。
  2. 这些反复的表述**没有引入新信息**（无新证据、新假设、新约束、新视角），也**没有缩小不确定性**，属于无效摇摆而非有效推进。

  ## 判定时的注意事项
  - **类型一关注"字面文本"**：看是否有连续片段被原样或近似原样重复。
  - **类型二关注"语义与信息增益"**：即使文字每次都不同，只要本质上是在重复同一个判断而没有任何新进展，也应判为复读机。
  - 注意区分**有效迭代**与**无效摇摆**：若模型每一轮都引入了新信息、推进到新的子问题、或逐步收窄了不确定性，则属于正常推理，**不应**判为复读机。
  - 正常的总结、回顾、为推进而做的必要重述，不属于复读机。

  ## 示例

  示例1（类型一：文本级重复）：
  The number of stranded whales has increased by more than 50 per cent in the past year, with the number of stranded whales on the West Australian coast increasing by more than 50 per cent in the past year. The number of whales stranded on the West Australian coast has increased by more than 50 per cent in the past year, with the number of stranded whales on the West Australian coast increasing by more than 50 per cent in the past year.

  这一段中反复输出相同片段：
  the West Australian coast increasing by more than 50 per cent in the past year

  示例2（类型二：推理级循环）：
  "我需要判断用户到底想要方案 A 还是方案 B。看起来 A 更合理……但也可能是 B，因为信息不够。让我再想想，到底是 A 还是 B 呢？如果是 A 的话……不对，也可能是 B。还是得确定一下是 A 还是 B。嗯，信息确实不太够，那到底该选 A 还是 B 呢……"

  这一段中模型反复回到"到底选 A 还是 B"这个同一未解决的判断点，每次表述虽不完全相同，但始终没有引入新信息（没有新证据、新约束），也没有缩小不确定性，属于推理级循环。

  # Input
  {trajectory}

  # Output
  输出需要是纯json，不得包含任何额外解释与markdown标记
  {
    "analysis": "你具体的分析 // 你需要在分析中指出判断复读机的具体依据、属于哪种类型（类型一文本级重复 / 类型二推理级循环）、重复或循环发生的阶段以及大体内容",
    "repeat": "true or false // 如果出现任意一种复读机现象，repeat字段为true"
  }
